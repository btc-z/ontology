site_name: Ontology
site_url: https://ontology.zihan.us/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

extra:
  generator: false
